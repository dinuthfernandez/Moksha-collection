services:
  # --- FastAPI backend (Python, talks to Supabase) ---
  - type: web
    name: moksha-collections-api
    env: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SCHEMA
        value: moksha_collection
      - key: SUPABASE_DB_PASSWORD
        sync: false
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: JWT_EXPIRES_MINUTES
        value: "20160"
      - key: ALLOWED_ORIGINS
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_JWT_EXPIRES_MINUTES
        value: "720"
      - key: FRONTEND_BASE_URL
        sync: false
      - key: PASSWORD_RESET_CODE_EXPIRES_MINUTES
        value: "15"
      - key: INFO_SMTP_HOST
        value: smtp.zoho.com
      - key: INFO_SMTP_PORT
        value: "587"
      - key: INFO_SMTP_USERNAME
        sync: false
      - key: INFO_SMTP_PASSWORD
        sync: false
      - key: INFO_SMTP_FROM_EMAIL
        sync: false
      - key: INFO_SMTP_FROM_NAME
        value: Moksha Collections
      - key: SALES_SMTP_HOST
        value: smtp.zoho.com
      - key: SALES_SMTP_PORT
        value: "587"
      - key: SALES_SMTP_USERNAME
        sync: false
      - key: SALES_SMTP_PASSWORD
        sync: false
      - key: SALES_SMTP_FROM_EMAIL
        sync: false
      - key: SALES_SMTP_FROM_NAME
        value: Moksha Collections
      - key: ZOHO_CLIENT_ID
        sync: false
      - key: ZOHO_CLIENT_SECRET
        sync: false
      - key: ZOHO_REFRESH_TOKEN
        sync: false
      - key: ZOHO_ORGANIZATION_ID
        sync: false
      - key: ZOHO_INVENTORY_SYNC_INTERVAL_SECONDS
        value: "3600"

  # --- React (Vite) frontend — static build ---
  - type: web
    name: moksha-collections-web
    env: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
      - key: VITE_WHATSAPP_NUMBER
        value: "97335521619"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
