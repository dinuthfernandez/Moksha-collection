services:
  # --- One Render web service: FastAPI serves both the REST API (under /api)
  # and the built React (Vite) frontend from the same process/URL. ---
  - type: web
    name: moksha-collections
    env: python
    plan: free
    rootDir: .
    buildCommand: cd frontend && npm install && npm run build && cd ../backend && pip install -r requirements.txt
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      # Pin Python — pydantic-core has no prebuilt wheel for brand-new Python
      # versions yet, which breaks the build trying to compile it from source.
      - key: PYTHON_VERSION
        value: 3.11.9

      # Baked into the frontend build — same-origin API, no separate frontend URL needed.
      - key: VITE_API_BASE_URL
        value: /api
      - key: VITE_WHATSAPP_NUMBER
        value: "97335521619"

      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SCHEMA
        value: moksha_collection
      - key: SUPABASE_DB_PASSWORD
        sync: false
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: JWT_EXPIRES_MINUTES
        value: "20160"
      - key: ALLOWED_ORIGINS
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_JWT_EXPIRES_MINUTES
        value: "720"
      - key: FRONTEND_BASE_URL
        sync: false
      - key: PASSWORD_RESET_CODE_EXPIRES_MINUTES
        value: "15"
      # Mail OAuth apps are separate from the Zoho Inventory credentials below.
      # Required scopes for each app: ZohoMail.accounts.READ,ZohoMail.messages.CREATE
      - key: INFO_ZOHO_CLIENT_ID
        sync: false
      - key: INFO_ZOHO_CLIENT_SECRET
        sync: false
      - key: INFO_ZOHO_REFRESH_TOKEN
        sync: false
      - key: INFO_ZOHO_ACCOUNTS_URL
        value: https://accounts.zoho.com
      - key: INFO_ZOHO_MAIL_API_URL
        value: https://mail.zoho.com
      - key: INFO_ZOHO_FROM_EMAIL
        value: info@mokshacollections.com
      - key: SALES_ZOHO_CLIENT_ID
        sync: false
      - key: SALES_ZOHO_CLIENT_SECRET
        sync: false
      - key: SALES_ZOHO_REFRESH_TOKEN
        sync: false
      - key: SALES_ZOHO_ACCOUNTS_URL
        value: https://accounts.zoho.com
      - key: SALES_ZOHO_MAIL_API_URL
        value: https://mail.zoho.com
      - key: SALES_ZOHO_FROM_EMAIL
        value: sales@mokshacollections.com
      - key: ZOHO_CLIENT_ID
        sync: false
      - key: ZOHO_CLIENT_SECRET
        sync: false
      - key: ZOHO_REFRESH_TOKEN
        sync: false
      - key: ZOHO_ORGANIZATION_ID
        sync: false
      - key: ZOHO_OFFLINE_SALE_WEBHOOK_SECRET
        sync: false
      - key: ZOHO_INVENTORY_SYNC_INTERVAL_SECONDS
        value: "3600"
